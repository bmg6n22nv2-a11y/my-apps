<!DOCTYPE html>
<html lang="ja">
<meta name="robots" content="noindex, nofollow">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シャドウイング練習</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --text: #1d2330; --muted: #6b7280;
  --accent: #2563eb; --accent-text: #ffffff; --line: #e3e6ec; --ok: #16a34a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #181c25; --text: #e8ebf1; --muted: #9aa3b2;
    --accent: #60a5fa; --accent-text: #0b1020; --line: #2a2f3a; --ok: #4ade80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  min-height: 100vh;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 0 40px; }
h1 { font-size: 1.25rem; margin: 0 0 16px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; margin-bottom: 14px;
}
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 18px; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
#ja { color: var(--muted); font-size: 1rem; line-height: 1.6; min-height: 3em; }
#en { font-size: 1.35rem; line-height: 1.5; font-weight: 600; margin-top: 10px; min-height: 4.5em; cursor: pointer; }
#en.hidden { filter: blur(8px); user-select: none; }
.hint { color: var(--muted); font-size: .8rem; margin-top: 8px; }
.controls { display: flex; gap: 10px; justify-content: center; align-items: center; margin: 6px 0 4px; }
button {
  font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface);
  color: var(--text); border-radius: 10px; padding: 10px 14px; min-width: 44px;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; padding: 12px 26px; }
button.small { font-size: .85rem; padding: 6px 10px; min-width: 0; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: .85rem; color: var(--muted); }
label.field span b { color: var(--text); }
select, textarea {
  font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px;
}
textarea { width: 100%; min-height: 120px; font-size: .8rem; font-family: ui-monospace, monospace; }
input[type=range] { width: 100%; }
.check { display: flex; align-items: center; gap: 6px; font-size: .9rem; }
.status { font-size: .85rem; color: var(--muted); margin-top: 8px; }
.status.ok { color: var(--ok); }
details summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>シャドウイング練習</h1>

  <div class="card">
    <div class="meta"><span id="counter">0 / 0</span><span id="catLabel"></span></div>
    <div class="bar"><div id="progress"></div></div>
    <div id="ja">読み込み中…</div>
    <div id="en" title="タップで表示/非表示">&nbsp;</div>
    <div class="hint">英文をタップすると表示を切り替えられます（暗記チェック用）</div>

    <div class="controls" style="margin-top:18px">
      <button id="prev" aria-label="前へ">⏮</button>
      <button id="play" class="primary">▶ 再生</button>
      <button id="next" aria-label="次へ">⏭</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div class="row">
      <label class="field">カテゴリ
        <select id="category">
          <option value="">すべて</option>
          <option value="Meeting">Meeting（会議）</option>
          <option value="Presentation">Presentation（プレゼン）</option>
        </select>
      </label>
      <div class="field" style="justify-content:flex-end">
        <label class="check"><input type="checkbox" id="shuffle"> ランダム順</label>
        <label class="check"><input type="checkbox" id="loop" checked> 最後まで来たら繰り返す</label>
      </div>
      <label class="field"><span>話す速度：<b id="rateVal">1.0</b></span>
        <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1"></label>
      <label class="field"><span>シャドウイングの間：<b id="gapVal">5</b> 秒</span>
        <input type="range" id="gap" min="2" max="12" step="1" value="5"></label>
      <label class="field"><span>1文の繰り返し回数：<b id="repVal">1</b> 回</span>
        <input type="range" id="repeat" min="1" max="3" step="1" value="1"></label>
      <label class="field"><span>表示</span>
        <label class="check"><input type="checkbox" id="showEn" checked> 英文を表示</label>
      </label>
    </div>
  </div>

  <div class="card">
    <details>
      <summary>フレーズデータの読み込み（全データを貼り付け）</summary>
      <p class="hint" style="margin:10px 0 8px">お手元の配列（{ category: "...", ja: "...", en: "..." } の行）をそのまま貼り付けて「読み込む」を押してください。</p>
      <textarea id="input" placeholder='{ category: "Meeting", ja: "...", en: "..." },'></textarea>
      <div class="actions">
        <button id="load" class="small primary">読み込む</button>
        <button id="reset" class="small">サンプルに戻す</button>
      </div>
      <div class="status" id="loadMsg"></div>
    </details>
  </div>
</div>

const state = {
  all: [],      // 全データ
  queue: [],    // 再生順
  idx: 0,       // 現在位置
  playing: false,
  pass: 0,      // 同じ文を何回目か
  timer: null
};

const $ = id => document.getElementById(id);
const speechOK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

// ---------- データ解析 ----------
function parsePhrases(text) {
  const out = [];
  const re = /ja:\s*"((?:[^"\\]|\\.)*)"\s*,\s*en:\s*"((?:[^"\\]|\\.)*)"/;
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(re);
    if (!m) continue;
    const c = line.match(/category:\s*"([^"]+)"/);
    out.push({ cat: c ? c[1] : "", ja: m[1], en: m[2] });
  }
  return out;
}

// ---------- キュー作成 ----------
function buildQueue(keepCurrent = false) {
  const cat = $("category").value;
  let list = state.all.filter(p => !cat || p.cat === cat);
  if ($("shuffle").checked) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
  }
  const current = keepCurrent && state.queue[state.idx];
  state.queue = list;
  state.idx = current ? Math.max(0, list.indexOf(current)) : 0;
  state.pass = 0;
  render();
}

// ---------- 表示 ----------
function render() {
  const n = state.queue.length;
  if (!n) {
    $("ja").textContent = "表示できるフレーズがありません";
    $("en").textContent = "";
    $("counter").textContent = "0 / 0";
    $("catLabel").textContent = "";
    $("progress").style.width = "0";
    return;
  }
  const p = state.queue[state.idx];
  $("ja").textContent = p.ja;
  $("en").textContent = p.en;
  $("en").classList.toggle("hidden", !$("showEn").checked);
  $("counter").textContent = `${state.idx + 1} / ${n}`;
  $("catLabel").textContent = p.cat;
  $("progress").style.width = `${((state.idx + 1) / n) * 100}%`;
}

function setStatus(msg, ok = false) {
  const el = $("status");
  el.textContent = msg;
  el.classList.toggle("ok", ok);
}

// ---------- 音声 ----------
function speak(text, onEnd) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = parseFloat($("rate").value);
  u.onend = onEnd;
  u.onerror = e => { if (e.error !== "interrupted" && e.error !== "canceled") setStatus("音声を再生できませんでした: " + e.error); };
  speechSynthesis.speak(u);
}

function updatePlayButton() {
  $("play").textContent = state.playing ? "⏸ 一時停止" : "▶ 再生";
}

// 1文ぶんの処理：読み上げ → 間（自分で繰り返す時間）→ 次
function step() {
  if (!state.playing) return;
  render();
  const p = state.queue[state.idx];
  if (!p) return stop();
  const reps = parseInt($("repeat").value, 10);
  const gapMs = parseInt($("gap").value, 10) * 1000;

  if (!speechOK) {
    setStatus("このブラウザは音声読み上げに対応していません。");
    return stop();
  }

  speak(p.en, () => {
    if (!state.playing) return;
    state.timer = setTimeout(() => {
      if (!state.playing) return;
      state.pass++;
      if (state.pass < reps) return step();   // 同じ文をもう一度
      state.pass = 0;
      advance(1);
    }, gapMs);
  });
}

function advance(dir) {
  const n = state.queue.length;
  let next = state.idx + dir;
  if (next >= n) {
    if ($("loop").checked) next = 0;
    else { state.idx = n - 1; return stop(); }
  }
  if (next < 0) next = 0;
  state.idx = next;
  state.pass = 0;
  if (state.playing) step(); else render();
}

function play() {
  if (!state.queue.length) return;
  state.playing = true;
  updatePlayButton();
  setStatus("再生中：英文を聞いて、間に声に出して繰り返しましょう", true);
  step();
}

function stop() {
  state.playing = false;
  clearTimeout(state.timer);
  if (speechOK) speechSynthesis.cancel();
  updatePlayButton();
  if ($("status").textContent.startsWith("再生中")) setStatus("一時停止中");
}

function togglePlay() { state.playing ? stop() : play(); }

function jump(dir) {
  const wasPlaying = state.playing;
  clearTimeout(state.timer);
  if (speechOK) speechSynthesis.cancel();
  state.playing = false;
  state.idx = Math.max(0, Math.min(state.queue.length - 1, state.idx + dir));
  state.pass = 0;
  render();
  if (wasPlaying) play(); else updatePlayButton();
}

// ---------- イベント ----------
$("play").onclick = togglePlay;
$("prev").onclick = () => jump(-1);
$("next").onclick = () => jump(1);
$("en").onclick = () => $("en").classList.toggle("hidden");
$("showEn").onchange = e => $("en").classList.toggle("hidden", !e.target.checked);
$("category").onchange = () => { stop(); buildQueue(); };
$("shuffle").onchange = () => { stop(); buildQueue(true); };
$("loop").onchange = () => {};
$("rate").oninput = e => $("rateVal").textContent = parseFloat(e.target.value).toFixed(1);
$("gap").oninput = e => $("gapVal").textContent = e.target.value;
$("repeat").oninput = e => $("repVal").textContent = e.target.value;
$("rate").onchange = () => { if (state.playing) { stop(); play(); } };

$("load").onclick = () => {
  const parsed = parsePhrases($("input").value);
  if (!parsed.length) {
    $("loadMsg").textContent = "読み取れる行がありませんでした。形式を確認してください。";
    return;
  }
  stop();
  state.all = parsed;
  buildQueue();
  $("loadMsg").textContent = `${parsed.length} 件を読み込みました`;
  $("loadMsg").className = "status ok";
};
$("reset").onclick = () => {
  stop();
  state.all = parsePhrases(SAMPLE);
  buildQueue();
  $("loadMsg").textContent = "サンプルに戻しました";
};

document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, select")) return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowRight") jump(1);
  else if (e.code === "ArrowLeft") jump(-1);
});

// ---------- 初期化 ----------
state.all = parsePhrases(SAMPLE);
buildQueue();
if (!speechOK) setStatus("このブラウザは音声読み上げに対応していません。");
</script>
</body>
</html>
